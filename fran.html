<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de control</title>
<style>
  :root{
    --bg:#1c2024; --panel:#262b31; --edge:#3a424b; --ink:#e8ecef; --muted:#8d98a3;
    --accent:#e0b04a; --danger:#d6453d; --ok:#4fb477;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:16px}
  .panel{width:min(1100px,100%);background:var(--panel);border:2px solid var(--edge);border-radius:18px;
    padding:28px;display:grid;grid-template-columns:230px 1fr 230px;gap:28px;align-items:center}

  /* Cámara */
  .camara{border:2px solid var(--edge);border-radius:12px;background:#0d0f11;aspect-ratio:4/3;
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .camara video{width:100%;height:100%;object-fit:contain;display:none}
  .camara.on video{display:block}
  .camara .msg{color:var(--muted);text-align:center;padding:12px}
  .camara.on .msg{display:none}
  .camara .mira{position:absolute;inset:0;pointer-events:none;display:none}
  .camara.on .mira{display:block}
  .mira::before,.mira::after{content:"";position:absolute;background:rgba(224,176,74,.7)}
  .mira::before{left:50%;top:30%;bottom:30%;width:1px}
  .mira::after{top:50%;left:30%;right:30%;height:1px}
  .power{position:absolute;top:10px;right:10px;z-index:2;display:flex;align-items:center;gap:8px;
    background:rgba(0,0,0,.55);border:1px solid var(--edge);color:var(--ink);padding:6px 12px;
    border-radius:20px;cursor:pointer;font:inherit;font-size:13px}
  .power i{width:10px;height:10px;border-radius:50%;background:var(--danger)}
  .camara.on .power i{background:var(--ok)}

  /* Cruceta */
  .cruceta{width:210px;height:210px;position:relative;justify-self:center}
  .dir{position:absolute;width:74px;height:74px;transform:rotate(45deg);border-radius:14px;
    border:2px solid var(--edge);background:var(--bg);color:var(--ink);cursor:pointer;padding:0}
  .dir span{display:block;transform:rotate(-45deg);font-size:13px}
  .dir:active,.dir.pres{background:var(--accent);color:#1c2024;border-color:var(--accent)}
  .dir[data-d="up"]{left:68px;top:0}
  .dir[data-d="left"]{left:0;top:68px}
  .dir[data-d="right"]{right:0;top:68px}
  .dir[data-d="down"]{left:68px;bottom:0}

  /* Derecha */
  .der{display:flex;flex-direction:column;gap:26px}
  .modos{display:flex;flex-direction:column;gap:10px}
  .modo{border:2px solid var(--edge);border-radius:8px;background:var(--bg);color:var(--ink);
    padding:10px;font:inherit;cursor:pointer}
  .modo[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  .acciones{display:flex;gap:14px;justify-content:center}
  .redondo{width:100px;height:100px;border-radius:50%;border:2px solid var(--edge);background:var(--bg);
    color:var(--ink);font:inherit;font-size:14px;cursor:pointer;line-height:1.3}
  .redondo:active{transform:scale(.96)}
  #disparar:active{background:var(--danger);border-color:var(--danger)}
  #laser[aria-pressed="true"]{background:var(--danger);border-color:var(--danger)}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  button:disabled{opacity:.4;cursor:not-allowed}

  .estado{grid-column:1/-1;font-size:13px;color:var(--muted);text-align:center;min-height:1.2em}

  @media (max-width:820px){
    .panel{grid-template-columns:1fr;padding:18px}
    .camara{order:-1}
    .cruceta{margin:10px 0}
  }
</style>
</head>
<body>
<main class="panel">

  <!-- Izquierda: movimiento -->
  <div class="cruceta" role="group" aria-label="Movimiento">
    <button class="dir" data-d="up" aria-label="Arriba"><span>UP</span></button>
    <button class="dir" data-d="left" aria-label="Izquierda"><span>LEFT</span></button>
    <button class="dir" data-d="right" aria-label="Derecha"><span>RIGHT</span></button>
    <button class="dir" data-d="down" aria-label="Abajo"><span>DOWN</span></button>
  </div>

  <!-- Centro: cámara -->
  <section class="camara" id="camara">
    <button class="power" id="power"><i></i><span>Encendido / Apagado</span></button>
    <video id="video" autoplay playsinline muted></video>
    <div class="mira"></div>
    <p class="msg" id="msg">Cámara apagada</p>
  </section>

  <!-- Derecha: modos y acciones -->
  <div class="der">
    <div class="modos" role="group" aria-label="Modo">
      <button class="modo" id="manual" aria-pressed="true">Manual</button>
      <button class="modo" id="auto" aria-pressed="false">Automático</button>
    </div>
    <div class="acciones">
      <button class="redondo" id="disparar">Disparar</button>
      <button class="redondo" id="laser" aria-pressed="false">Laser<br>ON / OFF</button>
    </div>
  </div>

  <div class="estado" id="estado">Listo.</div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const estado = $("estado");
  let modo = "manual", laser = false;

  // Punto único para conectar con tu hardware (ESP32, Arduino, servidor, etc.).
  // Ejemplo: fetch("http://192.168.0.50/cmd?c=" + comando)
  function enviarComando(comando){
    console.log("Comando:", comando);
    estado.textContent = "Comando: " + comando;
  }

  // ====== CONFIGURACIÓN ======
  // URL pública (https) de tu servidor Python, sin "/" al final.
  // Ejemplo con Cloudflare Tunnel: "https://algo-random.trycloudflare.com"
  const SERVER_URL = "https://PONE-ACA-TU-URL.trycloudflare.com";
  const ICE_SERVERS = [{urls:"stun:stun.l.google.com:19302"}];
  // ============================

  // Cámara en vivo por WebRTC (solo recibe video)
  let pc = null;

  function esperarICE(conn){
    return new Promise(res => {
      if(conn.iceGatheringState === "complete") return res();
      const fin = () => { if(conn.iceGatheringState === "complete"){ conn.removeEventListener("icegatheringstatechange", fin); res(); } };
      conn.addEventListener("icegatheringstatechange", fin);
      setTimeout(res, 4000);
    });
  }

  async function conectarCamara(){
    if(pc) return;
    $("msg").textContent = "Conectando…";
    estado.textContent = "Conectando con la cámara…";
    pc = new RTCPeerConnection({iceServers: ICE_SERVERS});
    pc.addTransceiver("video", {direction:"recvonly"});
    pc.ontrack = e => {
      $("video").srcObject = e.streams[0];
      $("camara").classList.add("on");
    };
    pc.onconnectionstatechange = () => {
      const st = pc && pc.connectionState;
      if(st === "connected") estado.textContent = "Cámara en vivo.";
      if(st === "failed" || st === "disconnected"){
        estado.textContent = "Se perdió la conexión con la cámara.";
        desconectarCamara("Sin señal");
      }
    };
    try{
      await pc.setLocalDescription(await pc.createOffer());
      await esperarICE(pc);
      const r = await fetch(SERVER_URL + "/offer", {
        method: "POST",
        headers: {"Content-Type":"application/json", "ngrok-skip-browser-warning":"1"},
        body: JSON.stringify({sdp: pc.localDescription.sdp, type: pc.localDescription.type})
      });
      if(!r.ok) throw new Error("HTTP " + r.status);
      await pc.setRemoteDescription(await r.json());
    }catch(e){
      console.error(e);
      estado.textContent = "No se pudo conectar con el servidor de la cámara.";
      desconectarCamara("Sin señal");
    }
  }

  function desconectarCamara(texto = "Cámara apagada"){
    if(pc){ pc.ontrack = null; pc.onconnectionstatechange = null; pc.close(); pc = null; }
    $("video").srcObject = null;
    $("camara").classList.remove("on");
    $("msg").textContent = texto;
  }

  $("power").addEventListener("click", () => {
    if(pc){ desconectarCamara(); estado.textContent = "Cámara apagada."; }
    else conectarCamara();
  });
  conectarCamara(); // se conecta sola al abrir la página

  // Modo manual / automático
  function setModo(m){
    modo = m;
    $("manual").setAttribute("aria-pressed", m === "manual");
    $("auto").setAttribute("aria-pressed", m === "auto");
    document.querySelectorAll(".dir, #laser").forEach(b => b.disabled = (m === "auto"));
    enviarComando("modo_" + m);
  }
  $("manual").onclick = () => setModo("manual");
  $("auto").onclick = () => setModo("auto");

  // Movimiento
  document.querySelectorAll(".dir").forEach(b => {
    b.addEventListener("click", () => enviarComando(b.dataset.d));
  });
  const teclas = {ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
  addEventListener("keydown", e => {
    const d = teclas[e.key];
    if(d && modo === "manual"){
      e.preventDefault();
      const b = document.querySelector(`.dir[data-d="${d}"]`);
      b.classList.add("pres"); enviarComando(d);
    }
  });
  addEventListener("keyup", e => {
    const d = teclas[e.key];
    if(d) document.querySelector(`.dir[data-d="${d}"]`).classList.remove("pres");
  });

  // Disparar y láser
  $("disparar").onclick = () => enviarComando("disparar");
  $("laser").onclick = () => {
    laser = !laser;
    $("laser").setAttribute("aria-pressed", laser);
    enviarComando(laser ? "laser_on" : "laser_off");
  };
</script>
</body>
</html>
