<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control ESP32 - Seguimiento Automático</title>
  <style>
    :root {
      --bg: #091018;
      --panel: #111b25;
      --panel-2: #162330;
      --line: #273746;
      --text: #eef5f9;
      --muted: #8fa3b3;
      --accent: #21c7ff;
      --accent-2: #0d90bd;
      --danger: #ff4d5f;
      --warning: #ffd84d;
      --success: #5de39b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(33,199,255,.08), transparent 30%),
        radial-gradient(circle at 85% 90%, rgba(255,77,95,.05), transparent 28%),
        var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: min(1180px, 100%);
      background: rgba(13, 21, 30, .96);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 28px 80px rgba(0,0,0,.42);
      overflow: hidden;
    }

    .topbar {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #14212c, #0e1821);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid #2f4759;
      background: #0b141d;
      display: grid;
      place-items: center;
      color: var(--accent);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .brand-text { line-height: 1.05; }
    .brand-text strong { display: block; font-size: 15px; letter-spacing: .08em; }
    .brand-text span { color: var(--muted); font-size: 11px; letter-spacing: .06em; }

    .power-area { display: flex; align-items: center; gap: 12px; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 12px rgba(255,77,95,.55); }
    .status-dot.on { background: var(--success); box-shadow: 0 0 12px rgba(93,227,155,.6); }

    .switch { position: relative; width: 58px; height: 31px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; cursor: pointer; background: #2a3641; border: 1px solid #3b4b59; border-radius: 999px; transition: .2s; }
    .slider::before { content: ""; position: absolute; width: 23px; height: 23px; left: 3px; top: 3px; border-radius: 50%; background: #d8e0e6; transition: .2s; }
    .switch input:checked + .slider { background: #0a718f; border-color: #24cfff; }
    .switch input:checked + .slider::before { transform: translateX(27px); background: white; }

    .content { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, .9fr); gap: 18px; padding: 18px; }
    .card { background: linear-gradient(180deg, rgba(21,34,46,.96), rgba(13,23,32,.96)); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }

    .camera-card { min-height: 515px; display: flex; flex-direction: column; gap: 14px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #dce8ee; font-weight: 700; }
    
    .live { display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 999px; background: rgba(255,77,95,.09); border: 1px solid rgba(255,77,95,.22); color: #ff9aa5; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #ff5264; }

    .camera { flex: 1; min-height: 355px; border-radius: 14px; border: 1px solid #33495a; background: #0a1118; display: grid; place-items: center; position: relative; overflow: hidden; }
    .camera img { width: 100%; height: 100%; object-fit: cover; display: block; background: #05090d; }

    .camera-overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; background: radial-gradient(circle, transparent 35%, rgba(0,0,0,.16) 100%); }
    .camera-btn { position: absolute; right: 14px; top: 14px; z-index: 3; border: 1px solid #2e6d80; background: rgba(9, 22, 30, .88); color: #e9fbff; border-radius: 9px; padding: 9px 12px; font-size: 10px; font-weight: 800; letter-spacing: .08em; cursor: pointer; text-transform: uppercase; }
    .camera-btn:hover { background: rgba(19, 58, 72, .94); }

    .crosshair { width: 90px; height: 90px; border: 1px solid rgba(33,199,255,.3); border-radius: 50%; position: relative; }
    .crosshair::before, .crosshair::after { content: ""; position: absolute; background: rgba(33,199,255,.6); }
    .crosshair::before { width: 1px; height: 118px; left: 44px; top: -15px; }
    .crosshair::after { height: 1px; width: 118px; top: 44px; left: -15px; }

    .camera-message { position: absolute; bottom: 18px; left: 18px; color: var(--muted); font-size: 11px; letter-spacing: .05em; }
    .camera-foot { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; }

    .right-column { display: grid; gap: 18px; align-content: start; }
    .mode-card { padding-bottom: 16px; }
    .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: #0d161e; }
    .mode-btn { border: 0; background: transparent; color: var(--muted); padding: 10px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 12px; letter-spacing: .06em; transition: .18s; }
    .mode-btn.active { background: #193747; color: #dff8ff; box-shadow: inset 0 0 0 1px #2b6b82; }

    .control-card { min-height: 310px; }
    .dpad { width: 190px; height: 190px; margin: 18px auto 10px; position: relative; }
    .dir { position: absolute; width: 68px; height: 68px; border-radius: 16px; border: 1px solid #3b4b58; background: linear-gradient(180deg, #1a2b38, #111b24); color: white; font-size: 23px; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,.18); touch-action: none; }
    .dir:hover { border-color: #3e8099; background: #1b3443; }
    .dir:active { transform: scale(.94); background: #245064; }
    .dir:disabled, .action-btn:disabled { opacity: .28; cursor: not-allowed; filter: grayscale(1); transform: none; }

    .up { top: 0; left: 61px; }
    .left { top: 61px; left: 0; }
    .right { top: 61px; right: 0; }
    .down { bottom: 0; left: 61px; }
    .dpad-center { position: absolute; width: 48px; height: 48px; border-radius: 50%; background: #0d161e; border: 1px solid #2a3c4a; top: 71px; left: 71px; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .action-btn { min-height: 116px; border-radius: 15px; border: 1px solid #3a4b59; cursor: pointer; color: white; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 9px; }
    .action-btn:active { transform: scale(.97); }
    .fire { background: linear-gradient(180deg, #12394a, #0d2631); border-color: #287c98; }
    .laser { background: linear-gradient(180deg, #4a3038, #281d22); border-color: #784652; }
    .icon { font-size: 26px; }
    .action-label { font-size: 11px; opacity: .9; }

    .state { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #0c151d; border: 1px solid var(--line); font-size: 11px; color: var(--muted); text-align: center; }

    @media (max-width: 900px) {
      body { padding: 10px; }
      .content { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">ESP</div>
        <div class="brand-text">
          <strong>CONTROL PANEL</strong>
          <span>ESP32 AP · SISTEMA DE OPERACIÓN</span>
        </div>
      </div>
      <div class="power-area">
        <div class="status">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">APAGADO</span>
        </div>
        <label class="switch" title="Encender / apagar sistema">
          <input id="power" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <main class="content">
      <section class="card camera-card">
        <div class="card-head">
          <span class="title">VISIÓN</span>
          <span class="live">CÁMARA</span>
        </div>
        <div class="camera">
          <img id="pythonCamera" alt="Cámara Python" style="display: none;">
          <div class="camera-overlay"><div class="crosshair"></div></div>
          <div id="cameraMessage" class="camera-message">CÁMARA PYTHON / SIN SEÑAL</div>
          <button id="cameraBtn" class="camera-btn" type="button">ACTIVAR CÁMARA</button>
        </div>
        <div class="camera-foot">
          <span>CONTROL REMOTO</span>
          <span id="modeReadout">MANUAL</span>
        </div>
      </section>

      <div class="right-column">
        <section class="card mode-card">
          <div class="card-head"><span class="title">MODO DE OPERACIÓN</span></div>
          <div class="mode-row">
            <button id="manualBtn" class="mode-btn active" type="button">MANUAL</button>
            <button id="autoBtn" class="mode-btn" type="button">AUTOMÁTICO</button>
          </div>
        </section>

        <section class="card control-card">
          <div class="card-head"><span class="title">MOVIMIENTO</span></div>
          <div class="dpad">
            <button class="dir up" data-dir="up" type="button" aria-label="Arriba">▲</button>
            <button class="dir left" data-dir="left" type="button" aria-label="Izquierda">◀</button>
            <button class="dir right" data-dir="right" type="button" aria-label="Derecha">▶</button>
            <button class="dir down" data-dir="down" type="button" aria-label="Abajo">▼</button>
            <div class="dpad-center"></div>
          </div>
          <div class="actions">
            <button id="fireBtn" class="action-btn fire" type="button">
              <span class="icon">◎</span>
              <span class="action-label">DISPARAR</span>
            </button>
            <button id="laserBtn" class="action-btn laser" type="button">
              <span class="icon">⌁</span>
              <span id="laserLabel" class="action-label">LÁSER: APAGADO</span>
            </button>
          </div>
          <div id="message" class="state">Sistema esperando órdenes.</div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const STREAM_URL = "http://192.168.4.2:5000/video_feed";

    const power = document.getElementById("power");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const manualBtn = document.getElementById("manualBtn");
    const autoBtn = document.getElementById("autoBtn");
    const modeReadout = document.getElementById("modeReadout");
    const laserBtn = document.getElementById("laserBtn");
    const laserLabel = document.getElementById("laserLabel");
    const message = document.getElementById("message");
    const fireBtn = document.getElementById("fireBtn");

    let laserOn = false;
    let automaticMode = false;
    let isCameraActive = false;

    const movableControls = [...document.querySelectorAll(".dir"), laserBtn];
    const pythonCamera = document.getElementById("pythonCamera");
    const cameraBtn = document.getElementById("cameraBtn");
    const cameraMessage = document.getElementById("cameraMessage");

    function showMessage(text) { message.textContent = text; }

    function startPcCamera() {
      pythonCamera.src = STREAM_URL;
      pythonCamera.style.display = "block";
      cameraBtn.textContent = "CÁMARA ACTIVA";
      cameraMessage.textContent = "";
      isCameraActive = true;
      showMessage("Conectado a la cámara de Python.");
    }

    function stopPcCamera() {
      pythonCamera.src = "";
      pythonCamera.style.display = "none";
      cameraBtn.textContent = "ACTIVAR CÁMARA";
      cameraMessage.textContent = "CÁMARA PYTHON / SIN SEÑAL";
      isCameraActive = false;
      showMessage("Cámara desconectada.");
    }

    function updateControlLock() {
      movableControls.forEach(control => {
        control.disabled = automaticMode;
        control.setAttribute("aria-disabled", automaticMode ? "true" : "false");
      });
      if (automaticMode) {
        laserOn = false;
        laserLabel.textContent = "LÁSER: APAGADO";
      }
    }

    function sendStep(direction) {
      if (automaticMode) return;
      fetch(`/step?dir=${direction}`)
        .then(response => {
          if (response.ok) showMessage("Un paso: " + direction);
        })
        .catch(error => showMessage("Error de conexión con ESP32."));
    }

    document.querySelectorAll(".dir").forEach(btn => {
      const dir = btn.getAttribute("data-dir");
      btn.addEventListener("click", () => sendStep(dir));
    });

    cameraBtn.addEventListener("click", () => {
      if (isCameraActive) stopPcCamera();
      else startPcCamera();
    });

    power.addEventListener("change", () => {
      const on = power.checked;
      statusDot.classList.toggle("on", on);
      statusText.textContent = on ? "ENCENDIDO" : "APAGADO";
      showMessage(on ? "Sistema activado." : "Sistema apagado.");
    });

    manualBtn.addEventListener("click", () => {
      automaticMode = false;
      manualBtn.classList.add("active");
      autoBtn.classList.remove("active");
      modeReadout.textContent = "MANUAL";
      updateControlLock();
      showMessage("Modo manual seleccionado.");
    });

    autoBtn.addEventListener("click", () => {
      automaticMode = true;
      autoBtn.classList.add("active");
      manualBtn.classList.remove("active");
      modeReadout.textContent = "AUTOMÁTICO";
      updateControlLock();
      showMessage("Modo automático bloqueado.");
    });

    laserBtn.addEventListener("click", () => {
      if (automaticMode) return;
      laserOn = !laserOn;
      const stateStr = laserOn ? "on" : "off";
      fetch(`/laser?state=${stateStr}`)
        .then(response => {
          if (response.ok) {
            laserLabel.textContent = laserOn ? "LÁSER: ENCENDIDO" : "LÁSER: APAGADO";
            showMessage(laserOn ? "Láser activado." : "Láser desactivado.");
          }
        })
        .catch(error => showMessage("Error de conexión con el láser."));
    });

    // Control real del solenoide al presionar DISPARAR
    fireBtn.addEventListener("click", () => {
      if (automaticMode) return;
      showMessage("¡Disparando...!");
      fetch(`/fire`)
        .then(response => {
          if (response.ok) {
            showMessage("Disparo realizado.");
          }
        })
        .catch(error => showMessage("Error al enviar orden de disparo."));
    });

    updateControlLock();
  </script>
</body>
</html>
